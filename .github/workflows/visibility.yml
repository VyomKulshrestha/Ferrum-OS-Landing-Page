name: Public visibility readiness

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:visibility
      - uses: actions/upload-artifact@v4
        with:
          name: ferrumos-visibility-source-readiness
          path: visibility-report.json

  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INDEXNOW_KEY: 522470e35fe44613a4a2f493a9a908c0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish IndexNow key for verification
        shell: bash
        run: |
          test -f "public/${INDEXNOW_KEY}.txt"
          test "$(tr -d '\r\n' < "public/${INDEXNOW_KEY}.txt")" = "${INDEXNOW_KEY}"
      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs --key "$INDEXNOW_KEY"
